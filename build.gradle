plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.knowledgelink'
version = '0.1.0-SNAPSHOT'
description = 'Jira·GitHub 개발 지식 연결 서비스'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.49.6')
    implementation 'software.amazon.awssdk:bedrockruntime'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-micrometer-metrics-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 단위 테스트는 Docker 없이 빠르게, 통합 테스트는 Testcontainers(PostgreSQL)로 분리한다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration', 'benchmark'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Testcontainers PostgreSQL 기반 통합 테스트'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

// 성능 비교는 오래 걸리고 수치가 실행 환경에 따라 달라 check에 넣지 않는다. 필요할 때 ./gradlew benchmark
tasks.register('benchmark', Test) {
    description = 'PostgreSQL 성능 비교 벤치마크(수동 실행)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    maxHeapSize = '1g'
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }
}

// 운영 앱의 DB·인증 구성을 건드리지 않고 mock 기반 해커톤 데모만 실행한다.
tasks.register('demoRun', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'DB 없이 KnowledgeLink 해커톤 데모를 실행한다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.knowledgelinkdemo.HackathonDemoApplication'
    args '--spring.profiles.active=demo'
}

// 운영 앱 artifact와 분리해 DB 없는 해커톤 데모만 EC2에 배포할 수 있는 실행 jar를 만든다.
tasks.register('demoBootJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    description = 'DB 없는 해커톤 데모용 실행 jar를 만든다.'
    archiveClassifier = 'demo'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.knowledgelinkdemo.HackathonDemoApplication'
    targetJavaVersion = JavaVersion.VERSION_21
}
