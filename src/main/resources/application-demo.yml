kl:
  demo:
    enabled: true
    ai:
      # 기본 데모는 네트워크·비용 없이 결정적으로 동작한다. 유료 공급자는 명시적으로만 활성화한다.
      provider: ${KL_DEMO_AI_PROVIDER:fake}
      openai:
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_MODEL:}
        endpoint: ${OPENAI_RESPONSES_ENDPOINT:https://api.openai.com/v1/responses}
        timeout: ${OPENAI_TIMEOUT:20s}
        embedding-model: ${OPENAI_EMBEDDING_MODEL:}
        embeddings-endpoint: ${OPENAI_EMBEDDINGS_ENDPOINT:https://api.openai.com/v1/embeddings}
      bedrock:
        region: ${AWS_REGION:}
        model: ${BEDROCK_MODEL_ID:}
        timeout: ${BEDROCK_TIMEOUT:30s}
        embedding-model: ${BEDROCK_EMBEDDING_MODEL_ID:}
    similar-work:
      top-k: ${KL_DEMO_SIMILAR_TOP_K:5}
      # 캐시되지 않은 새 질의만 센다. 공개 링크에서 유료 호출이 몰리는 것을 막는 상한이다.
      max-ai-requests-per-minute: ${KL_DEMO_SIMILAR_MAX_PER_MINUTE:20}
      cache-size: ${KL_DEMO_SIMILAR_CACHE_SIZE:200}
    past-work:
      # mock: 가명 fixture(기본, 네트워크 없음). apache: 공개 Apache Jira와 GitHub에서 해결된 이슈·병합 PR을 가져온다.
      source: ${KL_DEMO_PAST_WORK_SOURCE:mock}
      # 화면의 예시 질문. 출처마다 그 자료에 실제로 있는 문제를 고른다.
      mock-examples:
        - label: 결제 중복 생성
          query: 결제 버튼을 두 번 누르면 주문이 두 번 생성돼요
        - label: 로그인이 자꾸 풀림
          query: 서버를 늘린 뒤 로그인이 자꾸 풀린다는 문의가 들어옴
        - label: 대용량 다운로드 타임아웃
          query: 엑셀 다운로드가 너무 오래 걸리다가 타임아웃 남
        - label: 로그에 개인정보 노출
          query: 로그에 개인정보가 그대로 찍히는 것 같아요
      apache:
        jira-base-url: ${KL_DEMO_JIRA_BASE_URL:https://issues.apache.org/jira}
        project-key: ${KL_DEMO_JIRA_PROJECT:KAFKA}
        project-name: ${KL_DEMO_PROJECT_NAME:Apache Kafka}
        github-repository: ${KL_DEMO_GITHUB_REPOSITORY:apache/kafka}
        # 없으면 익명 호출(시간당 60회). 한 번 수집에 10회 안쪽이라 없어도 된다.
        github-token: ${GITHUB_TOKEN:}
        pull-request-pages: ${KL_DEMO_PR_PAGES:10}
        max-issues: ${KL_DEMO_MAX_ISSUES:200}
        issue-types: ${KL_DEMO_ISSUE_TYPES:Bug}
        # 수집에 성공하면 저장하고, 다음 기동에서 수집이 실패하면 이 저장본을 쓴다.
        snapshot-path: ${KL_DEMO_PAST_WORK_SNAPSHOT:}
        examples:
          - label: 스토어 메모리 누수
            query: RocksDB 스토어를 닫은 뒤에도 네이티브 메모리가 계속 늘다가 결국 OOM으로 죽어요
          - label: 재인증 실패 후 CPU 폭주
            query: 인증이 만료돼서 재인증에 실패하면 컨슈머 CPU 사용률이 100%로 치솟아요
          - label: DNS 실패로 클라이언트 종료
            query: 부트스트랩 서버 DNS를 잠깐 못 찾으면 클라이언트가 바로 실패해 버려요
          - label: 조회·업데이트 동시 데드락
            query: Kafka Streams에서 Interactive Query와 상태 저장소 업데이트가 동시에 실행되면 deadlock이 걸려요
