spring:
  application:
    name: knowledge-link
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  session:
    jdbc:
      # 세션 테이블도 Flyway가 관리한다(V3__spring_session.sql).
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 8h
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # 관측(ADR 0005). 지표·트레이스는 만들되 기본으로는 내보내지 않는다.
  # 수집기가 없을 때 전송 오류만 쌓이기 때문이다. 내보내기는 otel 프로필에서 켠다.
  tracing:
    sampling:
      # 데모 규모라 요청을 모두 기록한다. 트래픽이 늘면 낮춘다.
      probability: 1.0
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false

kl:
  jobs:
    # 명세 제안값(03 5장, 05 7장). 코드 기본값과 같다.
    lease: 120s
    heartbeat: 30s
    poll-interval: 2s
    max-attempts: 3
    retry-base: 30s
    retry-max: 300s
  jira:
    # 켜면 Jira Cloud를 실제로 호출한다. 인증 정보는 연결의 credential_ref가 가리키는
    # 환경 변수에 "서비스계정이메일:API토큰" 형식으로 둔다.
    enabled: false
    timeout: 10s
    page-size: 100

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
