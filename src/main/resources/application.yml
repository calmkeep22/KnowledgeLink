spring:
  application:
    name: knowledge-link
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  session:
    jdbc:
      # 세션 테이블도 Flyway가 관리한다(V3__spring_session.sql).
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 8h
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

kl:
  jobs:
    # 명세 제안값(03 5장, 05 7장). 코드 기본값과 같다.
    lease: 120s
    heartbeat: 30s
    poll-interval: 2s
    max-attempts: 3
    retry-base: 30s
    retry-max: 300s

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
