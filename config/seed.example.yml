# config/seed.yml로 복사해서 사용한다. config/seed.yml은 git에 올리지 않는다.
# 비밀번호·토큰은 파일에 쓰지 않고, 값을 담은 환경 변수 이름만 적는다.
# 등록된 계정은 첫 로그인 후 비밀번호를 바꿔야 한다.
# 여러 번 실행해도 같은 결과다. 이미 있는 계정·연결·scope·grant는 건너뛰고 삭제는 하지 않는다.
kl:
  seed:
    workspace-name: Demo Org
    accounts:
      - login-id: admin
        role: ADMIN
        initial-password-env: KL_SEED_ADMIN_PASSWORD
      - login-id: dev.kim
        role: MEMBER
        initial-password-env: KL_SEED_MEMBER_PASSWORD
    connections:
      - name: demo-jira
        kind: JIRA_CLOUD
        # Jira Cloud 사이트 ID(cloudId). https://<사이트>.atlassian.net/_edge/tenant_info 에서 확인한다.
        site-id: 00000000-0000-0000-0000-000000000000
        base-url: https://your-site.atlassian.net
        credential-ref: KL_JIRA_TOKEN
        scopes:
          - external-id: "10000"      # Jira 프로젝트 ID
            display-key: PAY          # 프로젝트 키
          - external-id: "10001"
            display-key: ORD
      - name: demo-github
        kind: GITHUB
        base-url: https://api.github.com
        credential-ref: KL_GITHUB_TOKEN
        scopes:
          - external-id: "123456789"  # GitHub 저장소 ID
            display-key: your-account/payment-service
    grants:
      # ADMIN은 조직의 모든 scope를 보므로 적지 않는다.
      - login-id: dev.kim
        scopes:
          - demo-jira:PAY
          - demo-github:your-account/payment-service
